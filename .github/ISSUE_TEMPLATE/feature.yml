name: 功能与优化建议
description: 为 PCL Living Fork 提出功能或体验改进建议。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明目前遇到的不便或需要解决的问题。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议内容
      description: 描述希望增加或调整的行为，可附示意图。
    validations:
      required: true
