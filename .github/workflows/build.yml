name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - '.gitmodules'
      - '*.sln'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore'
      - '.gitmodules'
      - '*.sln'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: ./scripts/Build-Release.ps1 -Configuration ${{ matrix.configuration }}

    - name: Verify build credential protection
      env:
        PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      run: powershell -NoProfile -File scripts/Test-BuildCredentials.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify account migration and updater
      run: powershell -NoProfile -STA -File scripts/Test-Release.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify cancelled version scanning
      run: powershell -NoProfile -STA -File scripts/Test-VersionListCancellation.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify audit regressions
      run: powershell -NoProfile -STA -File scripts/Test-AuditFixes.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify launcher window activation
      run: powershell -NoProfile -STA -File scripts/Test-LauncherActivation.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify toolbox operations
      run: powershell -NoProfile -File scripts/Test-Toolbox.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify memory helper permissions
      run: powershell -NoProfile -File scripts/Test-ToolboxMemory.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify native game resource management
      run: powershell -NoProfile -STA -File scripts/Test-InstanceResources.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify resource update compatibility and replacement
      run: powershell -NoProfile -STA -File scripts/Test-ResourceUpdates.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify personal game settings and Quick Play
      run: powershell -NoProfile -STA -File scripts/Test-LocalGameFeatures.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify first-run keybindings and Mojang Quick Play records
      run: powershell -NoProfile -STA -File scripts/Test-GameFeatureRegressions.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify modpack updates and personal changes
      run: powershell -NoProfile -STA -File scripts/Test-ModpackUpdate.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify file-operation cancellation, runtime recovery and redirect credentials
      run: powershell -NoProfile -STA -File scripts/Test-ReviewFixes.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify environment restore points
      run: powershell -NoProfile -STA -File scripts/Test-EnvironmentHistory.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify recent-world card animation and launch sequencing
      run: powershell -NoProfile -STA -File scripts/Test-RecentWorldCard.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify world protection, dependency checks, clones and resource regressions
      run: |
        $checks = @(
          'Test-WorldBackups', 'Test-WorldBackupGroups', 'Test-SaveBackupIntegration',
          'Test-ModDependencies', 'Test-ModDependencyOnline',
          'Test-InstanceClone', 'Test-InstanceCloneGroups', 'Test-RecentEnvironmentChanges',
          'Test-EnvironmentCoverage', 'Test-KeybindingGroups',
          'Test-MapDetails', 'Test-ResourceEntryPoints', 'Test-WorldDetails', 'Test-ScreenshotGallery'
        )
        foreach ($check in $checks) {
          powershell -NoProfile -STA -File "scripts/$check.ps1" -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"
          if ($LASTEXITCODE -ne 0) { throw "$check failed" }
        }

    - name: Verify custom download saves
      run: powershell -NoProfile -File scripts/Test-ToolboxDownload.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify modpack mode
      run: powershell -NoProfile -STA -File scripts/Test-ModpackMode.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify modpack folder isolation
      run: powershell -NoProfile -File scripts/Test-ModpackFolderScope.ps1

    - name: Verify shared version icons
      run: powershell -NoProfile -STA -File scripts/Test-IconCompatibility.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify complete overview component loading
      run: powershell -NoProfile -STA -File scripts/Test-InstalledComponentLoading.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Verify exported version isolation
      run: powershell -NoProfile -STA -File scripts/Test-ExportVersionIsolation.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Build legacy update bridge
      run: ./scripts/Build-UpdateBridge.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe" -OutputPath "Plain Craft Launcher 2\bin\legacy-update\LivingPCL.exe"

    - name: Verify update bridge handoff
      run: powershell -NoProfile -File scripts/Test-UpdateBridge.ps1 -ExecutablePath "Plain Craft Launcher 2\bin\PCL Living Fork.exe"

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PCL-Living-Fork ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\bin\PCL Living Fork.exe

    - name: Upload legacy update bridge
      uses: actions/upload-artifact@v7
      with:
        name: LivingPCL-legacy-update ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\bin\legacy-update\LivingPCL.exe
